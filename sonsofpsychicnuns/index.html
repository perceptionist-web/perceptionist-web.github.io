<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sons of Psychic Nuns Running Club</title>
  <meta name="description" content="Yorkshire cosmic running club — movement, psychic energy, steady pacing.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --text: #111;
      --light: #FEFEFE;
      --gray: #555;
      --accent: #000;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Instrument Sans', system-ui, sans-serif;
      line-height: 1.6;
      color: var(--text);
      background: var(--light);
      text-align: center;
    }

    a {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid var(--text);
      transition: all 0.2s ease;
    }

    a:hover, a:focus {
      border-color: transparent;
      background: rgba(0,0,0,0.06);
    }

    .container {
      max-width: 620px;
      margin: 0 auto;
      padding: 2rem 1.25rem;
    }

    .logo {
      max-width: 400px;
      margin: 2rem auto 3.5rem;
    }

    main {
      font-size: clamp(1.05rem, 3vw + 0.4rem, 1.125rem);
      line-height: 1.65;
      max-width: 65ch;
      margin: 0 auto;
    }

    h2 {
      margin: 3.5rem 0 1.2rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-size: 1.1rem;
    }

    .theme-section {
      margin: 4rem 0 5rem;
    }

    .soundcloud-wrapper {
      max-width: 500px;
      margin: 1.5rem auto 0;
    }

    footer {
      margin-top: 5rem;
      padding-top: 3rem;
      border-top: 1px solid #ddd;
      color: var(--gray);
      font-size: 0.95rem;
    }

    form {
      max-width: 420px;
      margin: 2rem auto 0;
      text-align: left;
    }

    label {
      display: block;
      margin: 1.5rem 0 0.5rem;
      font-size: 0.95rem;
      font-weight: 500;
    }

    input, textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font: inherit;
      font-size: 1rem;
    }

    textarea { min-height: 120px; resize: vertical; }

    button {
      margin-top: 1.8rem;
      padding: 0.9rem 2rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    /* NEW SOCIAL SECTION */
    .social-section { margin: 4rem 0 5rem; }

    .social-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin-top: 2rem;
    }

    .social-card {
      background: #fff;
      border: 1px solid #ddd;
      padding: 1.5rem;
      border-radius: 12px;
      text-align: left;
      transition: all 0.25s ease;
    }

    .social-card:hover {
      transform: translateY(-4px);
      border-color: #000;
      box-shadow: 0 6px 14px rgba(0,0,0,0.08);
    }

    .social-icon {
      width: 40px;
      height: auto;
      margin-bottom: 0.7rem;
    }

    .strava-embed iframe {
      border-radius: 8px;
      width: 100%;
      border: 1px solid #eee;
    }

    @media (max-width: 620px) {
      .social-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
<div class="container">

  <img src="sonsofpsychicnuns.png" class="logo" alt="Sons of Psychic Nuns Running Club logo">

  <main>

    <section class="theme-section">
      <h2>Theme tune</h2>

      <p>
        <a href="https://soundcloud.com/patri-3/sons-of-psychic-nuns" target="_blank">
          Sons of Psychic Nuns — by Patrick Grace (2012)
        </a>
      </p>

      <div class="soundcloud-wrapper">
        <iframe
          width="100%" height="166" frameborder="no" scrolling="no"
